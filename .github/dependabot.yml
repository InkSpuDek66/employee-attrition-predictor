# Dependabot เปิด PR อัปเดตแพ็กเกจให้เดือนละครั้ง รวมเป็น PR เดียวต่อ ecosystem เพื่อไม่ให้ PR ท่วม
# (แจ้งเตือนช่องโหว่ต้องเปิด Dependabot alerts / security updates ที่ Settings → Code security แยกต่างหาก)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # ต้องตรงกับ image ใน docker/mlflow/Dockerfile อัปเกรดพร้อมกันเองทั้งสองที่
      - dependency-name: mlflow

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

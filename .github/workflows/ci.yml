name: CI

on:
  push:
    branches: [main]
  pull_request:

# ให้ workflow อ่าน repo ได้อย่างเดียว ไม่พึ่งค่า default ของ repo ที่อาจถูกเปลี่ยน
permissions:
  contents: read

jobs:
  python:
    name: Python lint + train + backend tests (MLflow ใน docker compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      MLFLOW_TRACKING_URI: http://localhost:5000
      MODEL_URI: models:/attrition-xgboost-P/1
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # สแกนแพ็กเกจที่ติดตั้งจริงหาช่องโหว่ที่รู้จัก (fail ถ้าเจอ)
      - run: pip-audit
      - name: Start PostgreSQL + MLflow
        run: docker compose up -d --build --wait
      # เทรนโมเดลใหม่ทุกครั้ง ยืนยันว่าทำซ้ำได้จากโค้ดใน repo และ register เข้า MLflow ตัวจริงได้
      - run: python src/train.py
      # QA-01: test ของ DB (test_db.py) ข้ามเองถ้าไม่มี DATABASE_URL ตั้งให้ชี้ PostgreSQL ใน compose แล้วโหลด IBM ก่อน
      # ตั้งเฉพาะ 2 step นี้ ไม่ตั้งทั้ง job เพื่อให้ train.py ทำงานเหมือนเดิม
      - name: Load IBM employees into PostgreSQL
        run: python src/db.py
        env:
          DATABASE_URL: postgresql://attrition:ci-only-password@127.0.0.1:5432/attrition
      - name: Backend tests (รวม test ของ DB)
        run: python -m pytest backend -q -rs
        env:
          DATABASE_URL: postgresql://attrition:ci-only-password@127.0.0.1:5432/attrition
      - name: MLflow logs (เมื่อ fail)
        if: failure()
        run: docker compose logs mlflow

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

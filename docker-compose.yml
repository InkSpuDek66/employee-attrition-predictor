# Stack ที่ self-host ได้ทั้งหมด (open source) ข้อมูลไม่ออกนอกเครื่อง/เซิร์ฟเวอร์ของบริษัท
# รัน: docker compose up -d   ดูรายละเอียดที่ docs/mlflow_setup.md
# ค่าอ่านจาก .env ที่รากโปรเจกต์ (ดู .env.example) ต้องตั้ง POSTGRES_PASSWORD ก่อน

name: attrition

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env ก่อน (ดู .env.example)}
      POSTGRES_DB: attrition
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d attrition"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-attrition}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:*
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:

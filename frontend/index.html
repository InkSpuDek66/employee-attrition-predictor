<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f9fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1220" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Attrition Predictor</title>
    <script>
      // ตั้งธีมก่อน React render กันหน้าขาวแวบ: ใช้ค่าที่เคยเลือก ไม่มี = ตามเบราว์เซอร์ (ค่าเริ่มต้น)
      // คีย์ใหม่ themeMode: ทุกคนเริ่มที่ตามเบราว์เซอร์ (คีย์เก่า theme ไม่มีทางกลับไปตามเบราว์เซอร์)
      try {
        const t = localStorage.getItem('themeMode')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
